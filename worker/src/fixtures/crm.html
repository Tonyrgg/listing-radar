<!doctype html>
<html lang="it"><body>
  <main data-worker-crm="pageMarker">
    <button data-worker-crm="personSearchPage">Ricerca nominativi</button>
    <input data-worker-crm="personSearchTaxCode"><input data-worker-crm="personSearchPhone">
    <button data-worker-crm="personSearchSubmit">Cerca</button>
    <h1 data-worker-crm="personResultsReady">Risultati di ricerca</h1>
    <div data-worker-crm="personResultRows"><span data-worker-crm="personResultId">P-42</span><span data-worker-crm="personResultLabel">Maria Acquaviva</span><button data-worker-crm="personResultOpen">Apri</button></div>
    <button data-worker-crm="personRelatedTab">Correlati</button>
    <article data-worker-crm="personPropertiesCard"><a data-worker-crm="personPropertyLinks" href="#fixture-property">Immobile</a></article>
    <span data-worker-crm="propertySheetValue">58</span><span data-worker-crm="propertyParcelValue">1234</span><span data-worker-crm="propertySubalternValue">7</span><span data-worker-crm="propertyAddressValue">Via Roma, 12</span>
    <article data-worker-crm="activityCard"><button data-worker-crm="activityCreate">Nuovo</button></article>
    <div role="dialog" data-worker-crm="activityDialog"><textarea data-worker-crm="activityDescription"></textarea><input data-worker-crm="activityRelatedProperty"><input data-worker-crm="activityStatus" value="Da eseguire"><button data-worker-crm="activitySave">Salva</button><button data-worker-crm="activityCancel">Annulla</button></div>
    <article data-worker-crm="propertyOwnersCard"><a data-worker-crm="propertyOwnerLinks" href="#P-42">Proprietario</a></article>
    <button data-worker-crm="personCreate">Nuovo</button><button data-worker-crm="personCreateMenuItem">Nominativo</button>
    <input data-worker-crm="personFullName"><input data-worker-crm="personFirstName"><input data-worker-crm="personLastName"><input data-worker-crm="personBirthPlace"><input data-worker-crm="personBirthProvince">
    <input data-worker-crm="personBirthDate"><input data-worker-crm="personTaxCode"><input data-worker-crm="personMobile">
    <input data-worker-crm="personOfficePhone"><input data-worker-crm="personOtherPhone"><input data-worker-crm="personEmail">
    <button data-worker-crm="personSave" onclick="document.querySelector('[data-worker-crm=personMergeDialog]').hidden=false">Salva</button><span data-worker-crm="recordId">P-99</span>
    <section role="dialog" data-worker-crm="personMergeDialog" hidden>
      <p data-worker-crm="personMergeMessage">Nessun problema rilevato nel merge</p>
      <span data-worker-crm="personMergeReady">Merge verificato</span>
      <button data-worker-crm="personMergeConfirm" onclick="this.closest('[role=dialog]').hidden=true">Conferma merge</button>
    </section>
    <button data-worker-crm="propertySearchPage">Ricerca immobili</button><input data-worker-crm="propertySearchSheet"><input data-worker-crm="propertySearchParcel"><input data-worker-crm="propertySearchSubaltern">
    <button data-worker-crm="propertySearchSubmit">Cerca immobile</button>
    <div data-worker-crm="propertyResultRow"><span data-worker-crm="propertyResultId">I-42</span><button data-worker-crm="propertyResultOpen">Apri immobile</button></div>
    <button data-worker-crm="propertyCreate">Nuovo immobile</button><input data-worker-crm="propertyAddress"><input data-worker-crm="propertySheet"><input data-worker-crm="propertyParcel"><input data-worker-crm="propertySubaltern">
    <input data-worker-crm="propertyCategory"><input data-worker-crm="propertyClass"><input data-worker-crm="propertyConsistency"><input data-worker-crm="propertyIncome">
    <button data-worker-crm="propertySave">Salva immobile</button>
    <input data-worker-crm="ownerPersonId"><input data-worker-crm="ownerShare"><button data-worker-crm="ownerSave">Collega</button>
  </main>
</body></html>
